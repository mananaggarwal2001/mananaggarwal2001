name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch: # allows running it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7aa2f7&color_dots=#ebedf0,#c9d6f9,#a3b9f5,#7aa2f7,#4a6fd6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bb9af7&color_dots=#161b22,#2a3466,#3d5199,#5a73cc,#7aa2f7

      - name: Push the SVGs to the output branch
        run: |
          mkdir publish
          cp dist/*.svg publish/
          cd publish
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update snake animation"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
