<svg xmlns="http://www.w3.org/2000/svg" width="860" height="14" viewBox="0 0 860 14" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#f7768e"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="860" height="14" fill="url(#fade)"/></mask>
    <filter id="glow" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g mask="url(#m)">
    <rect x="0" y="5.5" width="860" height="3" rx="1.5" fill="url(#g)" filter="url(#glow)"/>
  </g>
</svg>
