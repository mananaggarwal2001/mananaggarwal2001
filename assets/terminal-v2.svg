<svg xmlns="http://www.w3.org/2000/svg" width="860" height="476" viewBox="0 0 860 476" role="img" aria-label="Terminal intro: Manan Aggarwal, Full-Stack Web Developer in Melbourne">
  <defs>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#f7768e"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#f7768e"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="typed">
      <rect x="160" y="56" height="24" width="0">
        <animate attributeName="width" begin="0.4s" dur="0.9s" fill="freeze" calcMode="discrete"
                 values="0;10;19;28;37;46;55;64;73;82;91;100"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; }
    .prompt { fill: #9ece6a; font-weight: 700; }
    .path { fill: #7aa2f7; font-weight: 700; }
    .cmd { fill: #c0caf5; }
    .key { fill: #7aa2f7; font-weight: 700; }
    .val { fill: #c0caf5; }
    .user { fill: #bb9af7; font-weight: 700; font-size: 17px; }
    .at { fill: #565f89; font-size: 17px; }
    .rule { fill: #3b4261; }
    .title { fill: #787c99; font-size: 13px; }
    .line { opacity: 0; animation: show 0.35s ease-out forwards; }
    .mono { opacity: 0; animation: pop 0.6s ease-out 1.4s forwards; transform-origin: 130px 262px; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Window -->
  <rect x="2" y="2" width="856" height="472" rx="14" fill="#1a1b26" stroke="url(#border)" stroke-width="2.5"/>
  <path d="M2 16 a14 14 0 0 1 14 -14 h828 a14 14 0 0 1 14 14 v24 h-856 z" fill="#16161e"/>
  <circle cx="26" cy="21" r="6.5" fill="#f7768e"/>
  <circle cx="48" cy="21" r="6.5" fill="#e0af68"/>
  <circle cx="70" cy="21" r="6.5" fill="#9ece6a"/>
  <text x="430" y="26" text-anchor="middle" class="title">manan@github: ~</text>

  <!-- Command -->
  <text x="24" y="73"><tspan class="prompt">manan@github</tspan><tspan class="cmd">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ </tspan></text>
  <text x="160" y="73" class="cmd" clip-path="url(#typed)">neofetch</text>

  <!-- Monogram -->
  <g class="mono">
    <circle cx="130" cy="262" r="86" fill="url(#mono)" opacity="0.35" filter="url(#glow)"/>
    <circle cx="130" cy="262" r="80" fill="url(#mono)"/>
    <circle cx="130" cy="262" r="72" fill="#1a1b26"/>
    <text x="130" y="284" text-anchor="middle" style="font-size:62px;font-weight:800" fill="url(#mono)">MA</text>
  </g>

  <!-- Info -->
  <g transform="translate(260 0)">
    <text x="0" y="112" class="line" style="animation-delay:1.4s"><tspan class="user">manan</tspan><tspan class="at">@</tspan><tspan class="user">github</tspan></text>
    <rect x="0" y="122" width="190" height="2" class="rule line" style="animation-delay:1.5s"/>
    <text x="0" y="152" class="line" style="animation-delay:1.65s"><tspan class="key">Name</tspan><tspan class="val" x="122">Manan Aggarwal</tspan></text>
    <text x="0" y="178" class="line" style="animation-delay:1.8s"><tspan class="key">Role</tspan><tspan class="val" x="122">Full-Stack Web Developer</tspan></text>
    <text x="0" y="204" class="line" style="animation-delay:1.95s"><tspan class="key">Location</tspan><tspan class="val" x="122">Melbourne, Australia</tspan></text>
    <text x="0" y="230" class="line" style="animation-delay:2.1s"><tspan class="key">Education</tspan><tspan class="val" x="122">Master of IT @ RMIT University</tspan></text>
    <text x="0" y="256" class="line" style="animation-delay:2.25s"><tspan class="key">Frontend</tspan><tspan class="val" x="122">React, Next.js, Tailwind CSS</tspan></text>
    <text x="0" y="282" class="line" style="animation-delay:2.4s"><tspan class="key">Backend</tspan><tspan class="val" x="122">Node.js, Express, MongoDB, MySQL</tspan></text>
    <text x="0" y="308" class="line" style="animation-delay:2.55s"><tspan class="key">Focus</tspan><tspan class="val" x="122">Next.js auth, middleware, SSR/SSG/ISR</tspan></text>
    <text x="0" y="334" class="line" style="animation-delay:2.7s"><tspan class="key">Practising</tspan><tspan class="val" x="122">DSA in Java (150+ problems solved)</tspan></text>
    <text x="0" y="360" class="line" style="animation-delay:2.85s"><tspan class="key">Next up</tspan><tspan class="val" x="122">Machine learning</tspan></text>
    <text x="0" y="386" class="line" style="animation-delay:3s"><tspan class="key">Portfolio</tspan><tspan class="val" x="122">mananpersonalportfolio.netlify.app</tspan></text>
    <text x="0" y="412" class="line" style="animation-delay:3.15s"><tspan class="key">Open to</tspan><tspan class="val" x="122">Internships, graduate roles, collabs</tspan></text>
    <g class="line" style="animation-delay:3.3s">
      <rect x="0"   y="424" width="30" height="14" fill="#f7768e"/>
      <rect x="30"  y="424" width="30" height="14" fill="#ff9e64"/>
      <rect x="60"  y="424" width="30" height="14" fill="#e0af68"/>
      <rect x="90"  y="424" width="30" height="14" fill="#9ece6a"/>
      <rect x="120" y="424" width="30" height="14" fill="#7dcfff"/>
      <rect x="150" y="424" width="30" height="14" fill="#7aa2f7"/>
      <rect x="180" y="424" width="30" height="14" fill="#bb9af7"/>
      <rect x="210" y="424" width="30" height="14" fill="#c0caf5"/>
    </g>
  </g>

  <!-- Final prompt -->
  <g class="line" style="animation-delay:3.5s">
    <text x="24" y="462"><tspan class="prompt">manan@github</tspan><tspan class="cmd">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ </tspan></text>
    <rect x="160" y="449" width="9" height="17" fill="#c0caf5" class="cursor"/>
  </g>
</svg>
